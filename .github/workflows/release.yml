name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

  release:
    name: Release
    needs: build-and-test
    runs-on: macos-15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          # Get the latest tag, default to v0.0.0 if none exists
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"

          # Strip 'v' prefix
          VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          # Scan commit messages since last tag for version bump signals
          if [ "$LATEST_TAG" = "v0.0.0" ]; then
            COMMITS=$(git log --oneline)
          else
            COMMITS=$(git log "${LATEST_TAG}..HEAD" --oneline)
          fi

          if echo "$COMMITS" | grep -qiE '(BREAKING CHANGE|!:)'; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif echo "$COMMITS" | grep -qiE '^[a-f0-9]+ feat'; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: v${NEW_VERSION}"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Developer ID certificate
        if: steps.tag_check.outputs.exists == 'false' && env.DEVELOPER_CERTIFICATE_BASE64 != ''
        env:
          DEVELOPER_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_CERTIFICATE_BASE64 }}
          DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Decode and import certificate
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$DEVELOPER_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -P "$DEVELOPER_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

          # Set keychain search list
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Extract Developer ID identity
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          if [ -n "$IDENTITY" ]; then
            echo "DEVELOPER_ID_APPLICATION=$IDENTITY" >> "$GITHUB_ENV"
            echo "::notice::Using Developer ID: $IDENTITY"
          else
            echo "::warning::Certificate imported but no Developer ID Application identity found"
          fi

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build and package
        if: steps.tag_check.outputs.exists == 'false'
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash scripts/package-app.sh

      - name: Notarize
        if: steps.tag_check.outputs.exists == 'false' && env.NOTARY_APPLE_ID != ''
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          echo "→ Submitting DMG for notarization..."
          xcrun notarytool submit build/KimchiCompanion.dmg \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --wait

          echo "→ Stapling app bundle..."
          xcrun stapler staple "build/Kimchi Companion.app"

          echo "→ Re-creating DMG with stapled app..."
          rm -f build/KimchiCompanion.dmg
          hdiutil create \
            -volname "Kimchi Companion" \
            -srcfolder "build/Kimchi Companion.app" \
            -ov \
            -format UDZO \
            build/KimchiCompanion.dmg

          echo "→ Updating SHA256 checksum..."
          SHA256=$(shasum -a 256 build/KimchiCompanion.dmg | awk '{print $1}')
          echo "$SHA256  KimchiCompanion.dmg" > build/KimchiCompanion.dmg.sha256
          echo "  ✓ Notarized DMG SHA256: $SHA256"

      - name: Create tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: false
          generate_release_notes: true
          body: |
            ## Install

            ### Homebrew (recommended)
            ```bash
            brew tap castai/homebrew-tap
            brew install --cask kimchi-companion
            ```

            ### Manual download
            1. Download `KimchiCompanion.dmg` below
            2. Open the DMG and drag **Kimchi Companion** to Applications
            3. Launch from Applications — it appears in the menu bar

            ### Verify download integrity
            ```bash
            shasum -a 256 -c KimchiCompanion.dmg.sha256
            ```
          files: |
            build/KimchiCompanion.dmg
            build/KimchiCompanion.dmg.sha256

      - name: Update Homebrew tap
        if: steps.tag_check.outputs.exists == 'false'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA256=$(cat build/KimchiCompanion.dmg.sha256 | awk '{print $1}')

          echo "→ Updating homebrew-tap with v${VERSION} (sha256: ${SHA256})"

          # Generate the cask formula
          cat > /tmp/kimchi-companion.rb << CASK
          cask "kimchi-companion" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/castai/kimchi-companion/releases/download/v#{version}/KimchiCompanion.dmg"
            name "Kimchi Companion"
            desc "macOS menu bar companion for CAST AI usage monitoring"
            homepage "https://github.com/castai/kimchi-companion"

            livecheck do
              url :url
              strategy :github_latest
            end

            depends_on macos: ">= :sonoma"

            app "Kimchi Companion.app"

            zap trash: [
              "~/Library/Application Support/KimchiCompanion",
              "~/Library/Preferences/com.castai.kimchi-companion.plist",
              "~/Library/Caches/com.castai.kimchi-companion",
            ]
          end
          CASK

          # Strip leading whitespace from heredoc
          sed -i '' 's/^          //' /tmp/kimchi-companion.rb

          # Push to homebrew-tap via GitHub API
          CONTENT=$(base64 < /tmp/kimchi-companion.rb)

          # Check if file already exists (need SHA for update)
          EXISTING_SHA=$(gh api repos/castai/homebrew-tap/contents/Casks/kimchi-companion.rb --jq '.sha' 2>/dev/null || echo "")

          if [ -n "$EXISTING_SHA" ]; then
            gh api -X PUT repos/castai/homebrew-tap/contents/Casks/kimchi-companion.rb \
              -f message="Update kimchi-companion to v${VERSION}" \
              -f content="$CONTENT" \
              -f sha="$EXISTING_SHA"
          else
            gh api -X PUT repos/castai/homebrew-tap/contents/Casks/kimchi-companion.rb \
              -f message="Add kimchi-companion v${VERSION}" \
              -f content="$CONTENT"
          fi

          echo "  ✓ Homebrew tap updated"

      - name: Cleanup keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
            echo "::notice::Temporary keychain cleaned up"
          fi
